# hamlet workspace — layout ratified by ADR-0001 (docs/adr/0001-workspace-layout.md).
# SPEC.md is law; roadmap/CONVENTIONS.md §2 locks the dependency stack below.
# Additions to [workspace.dependencies] require an ADR (check-deps.sh enforces).

[workspace]
resolver = "2"
members = [
    "crates/hamlet-core",
    "crates/hamlet-daemon",
    "crates/hamlet-cli",
    "crates/hamlet-tui",
    "crates/hamlet-web",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
# --- internal (path deps; exempt from the allowlist) ---
hamlet-core = { path = "crates/hamlet-core" }

# --- locked stack, SPEC §3 (versions [DEV] within these majors) ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
axum = "0.7"
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
dotenvy = "0.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6"
