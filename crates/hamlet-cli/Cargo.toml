[package]
name = "hamlet-cli"
description = "The `hamlet` binary: operator command surface (SPEC §12.1). No orchestration state."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "hamlet_cli"
path = "src/lib.rs"

[[bin]]
name = "hamlet"
path = "src/main.rs"

[dependencies]
hamlet-core = { workspace = true }
hamlet-daemon = { workspace = true }
hamlet-tui = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
