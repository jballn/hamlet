[package]
name = "hamlet-daemon"
description = "The singular governor: only crate that spawns processes or mutates a live .hamlet/ tree (ADR-0001)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Locked stack (SPEC §3 / CONVENTIONS §2) — additions require an ADR.
hamlet-core = { workspace = true }
sled = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "time", "net"] }
notify = { workspace = true }
reqwest = { workspace = true }        # dispatch outbox sends (ADR-0020)
axum = { workspace = true, features = ["ws"] }            # inbound webhook endpoints (ADR-0022)
tokio-tungstenite = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }             # hard body cap below extractors
dotenvy = { workspace = true }         # pure .env parsing at send time (ADR-0020 cl. 6)

[dev-dependencies]
tempfile = "3"
# Sled's `testing` feature switches its db lock from try-lock to blocking
# wait (sled documents try-lock races under test load; see sled config.rs).
# Test-only: production builds keep the workspace dep without this feature.
sled = { workspace = true, features = ["testing"] }
