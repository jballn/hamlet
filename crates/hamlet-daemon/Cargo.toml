[package]
name = "hamlet-daemon"
description = "The singular governor: only crate that spawns processes or mutates a live .hamlet/ tree (ADR-0001)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Locked stack (SPEC §3 / CONVENTIONS §2) — additions require an ADR.
hamlet-core = { workspace = true }
sled = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time"] }
# TODO(sprint 02): notify once the watcher loops land.

[dev-dependencies]
tempfile = "3"
